<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project HUB - Login</title>
    <!-- Importando a fonte Inter do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Importando ícones do FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #4B39EF; 
            --primary-glow: rgba(75, 57, 239, 0.35);
            --primary-focus: rgba(75, 57, 239, 0.15);
            --text-dark: #1F2937;
            --text-gray: #4B5563;
            --text-light: #6B7280;
            --border-color: #D1D5DB;
            --bg-body: #F4F7FB;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f0f4f8 0%, #ffffff 50%, #eef2f6 100%);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Cabeçalho */
        .header-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-img {
            height: 60px;
            width: auto;
            display: block;
            margin: 0 auto 15px auto;
            object-fit: contain;
        }

        .title {
            color: var(--primary-color);
            font-size: 30px;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-gray);
            font-size: 14px;
            margin: 0;
        }

        /* Cartão Branco de Login */
        .login-card {
            background-color: #ffffff;
            width: 100%;
            border-radius: 16px;
            padding: 35px 40px;
            box-shadow: 0px 12px 35px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
            position: relative; /* Necessário para o popover flutuar em relação ao cartão */
        }

        /* Sobreposição escura quando o tooltip abre */
        .overlay {
            display: none; /* Escondido por padrão */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(244, 247, 251, 0.8);
            border-radius: 16px;
            z-index: 5;
        }

        .overlay.active {
            display: block;
        }

        /* Badge Superior */
        .badge-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .badge {
            background-color: rgba(75, 57, 239, 0.05);
            border: 1px solid rgba(75, 57, 239, 0.2);
            color: var(--primary-color);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        /* Formulário */
        .input-group {
            margin-bottom: 22px;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .forgot-password {
            font-size: 12px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.left-icon {
            position: absolute;
            left: 16px;
            color: #9CA3AF;
            font-size: 15px;
        }

        .input-wrapper i.right-icon {
            position: absolute;
            right: 16px;
            color: #9CA3AF;
            font-size: 15px;
            cursor: pointer;
        }

        .input-wrapper input {
            width: 100%;
            padding: 15px 15px 15px 48px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-dark);
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
            font-family: inherit;
        }

        .input-wrapper input::placeholder {
            color: #9CA3AF;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--primary-focus); 
        }

        .input-wrapper input:focus + i.left-icon,
        .input-wrapper:focus-within i.left-icon {
            color: var(--primary-color);
        }

        /* Checkbox */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
            margin-top: -5px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 16px;
            height: 16px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .checkbox-group label {
            font-size: 13px;
            color: var(--text-gray);
            cursor: pointer;
        }

        /* Botão de Login */
        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            box-shadow: 0 8px 20px -6px var(--primary-glow);
        }

        .btn-submit:hover {
            background-color: #3b2cc4;
            box-shadow: 0 10px 25px -5px var(--primary-glow);
            transform: translateY(-1px);
        }

        /* --- SESSÃO DE SOLICITAR ACESSO E BOTÃO DE AJUDA --- */
        .register-section {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 25px;
            gap: 10px; /* Espaço entre o texto e o botão */
            position: relative;
        }

        .register-link {
            font-size: 13px;
            color: var(--text-gray);
        }

        .register-link-text {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 20px;
            transition: background-color 0.2s;
        }

        /* Destaca o link quando o tooltip estiver ativo */
        .register-link-text.highlight {
            border: 2px solid var(--primary-color);
            background-color: rgba(75, 57, 239, 0.05);
            z-index: 10; /* Para ficar acima do overlay */
            position: relative;
        }

        /* Botão de Interrogação */
        .btn-help {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 10;
        }

        .btn-help.active {
            background-color: var(--primary-color);
            color: white;
        }

        /* --- CAIXA DE DIÁLOGO (POPOVER) --- */
        .popover-help {
            display: none; /* Escondido por padrão */
            position: absolute;
            bottom: calc(100% + 15px); /* Posicionado acima do botão/texto */
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            padding: 20px 24px;
            z-index: 10;
            box-sizing: border-box;
        }

        .popover-help.active {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, 10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* A "setinha" apontando para baixo */
        .popover-help::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%) rotate(45deg);
            width: 16px;
            height: 16px;
            background-color: white;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.05); /* Sombra só na parte de baixo */
            z-index: -1;
        }

        .popover-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .popover-step {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .popover-close {
            background: #F3F4F6;
            border: none;
            border-radius: 6px;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-gray);
            cursor: pointer;
            font-size: 12px;
        }

        .popover-close:hover {
            background: #E5E7EB;
        }

        .popover-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-dark);
            margin: 0 0 10px 0;
        }

        .popover-text {
            font-size: 14px;
            color: var(--text-gray);
            margin: 0 0 20px 0;
            line-height: 1.5;
        }

        .popover-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Barrinha de progresso */
        .progress-bar {
            width: 20px;
            height: 4px;
            background-color: var(--primary-color);
            border-radius: 2px;
        }

        .btn-concluir {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .btn-concluir:hover {
            background-color: #3b2cc4;
        }


        /* Rodapé */
        .page-footer {
            margin-top: 35px;
            text-align: center;
            font-size: 12px;
            color: #9CA3AF;
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <!-- Cabeçalho -->
        <div class="header-section">
            <img src="logo comau.webp" alt="Comau Logo" class="logo-img">
            <h1 class="title">Project HUB</h1>
            <p class="subtitle">Acompanhe projetos, equipes e prazos em um só lugar</p>
        </div>

        <!-- Cartão de Login -->
        <div class="login-card">
            
            <!-- Overlay escuro que aparece com o popover -->
            <div class="overlay" id="overlay"></div>

            <div class="badge-wrapper">
                <div class="badge">
                    <i class="fa-regular fa-shield-check"></i> AMBIENTE CORPORATIVO COMAU
                </div>
            </div>

            <form action="#" method="POST">
                
                <div class="input-group">
                    <div class="input-header">
                        <label for="email">E-mail corporativo</label>
                    </div>
                    <div class="input-wrapper">
                        <i class="far fa-envelope left-icon"></i>
                        <input type="email" id="email" placeholder="nome@comau.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-header">
                        <label for="password">Senha</label>
                        <a href="#" class="forgot-password">Esqueceu a senha?</a>
                    </div>
                    <div class="input-wrapper">
                        <i class="fas fa-lock left-icon"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <i class="far fa-eye-slash right-icon"></i>
                    </div>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember">
                    <label for="remember">Lembrar meu e-mail neste dispositivo</label>
                </div>

                <button type="submit" class="btn-submit">Entrar no Project HUB</button>
                
                <!-- SESSÃO: Solicitar Acesso + Botão de Ajuda -->
                <div class="register-section">
                    <span class="register-link">
                        Não tem acesso? 
                        <a href="#" class="register-link-text" id="linkSolicitar">Solicitar acesso</a>
                    </span>
                    
                    <button type="button" class="btn-help" id="btnHelp">?</button>

                    <!-- CAIXA DE DIÁLOGO (POPOVER) -->
                    <div class="popover-help" id="popoverHelp">
                        <div class="popover-header">
                            <span class="popover-step">PASSO 1 DE 1</span>
                            <button type="button" class="popover-close" id="btnClosePopover">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <h3 class="popover-title">Solicite seu acesso</h3>
                        <p class="popover-text">Clique neste botão para abrir o formulário de solicitação.</p>
                        
                        <div class="popover-footer">
                            <div class="progress-bar"></div>
                            <button type="button" class="btn-concluir" id="btnConcluir">
                                Concluir <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>

            </form>
        </div>

        <div class="page-footer">
            &copy; 2024 Comau Automação - Versão 2.2.0
        </div>

    </div>

    <!-- Script para controlar a abertura e fechamento do Popover -->
    <script>
        const btnHelp = document.getElementById('btnHelp');
        const popoverHelp = document.getElementById('popoverHelp');
        const btnClosePopover = document.getElementById('btnClosePopover');
        const btnConcluir = document.getElementById('btnConcluir');
        const overlay = document.getElementById('overlay');
        const linkSolicitar = document.getElementById('linkSolicitar');

        // Função para abrir o popover
        function openPopover() {
            popoverHelp.classList.add('active');
            btnHelp.classList.add('active');
            overlay.classList.add('active');
            linkSolicitar.classList.add('highlight');
        }

        // Função para fechar o popover
        function closePopover() {
            popoverHelp.classList.remove('active');
            btnHelp.classList.remove('active');
            overlay.classList.remove('active');
            linkSolicitar.classList.remove('highlight');
        }

        // Eventos de clique
        btnHelp.addEventListener('click', function(e) {
            e.preventDefault();
            // Alterna entre abrir e fechar
            if (popoverHelp.classList.contains('active')) {
                closePopover();
            } else {
                openPopover();
            }
        });

        // Fecha ao clicar no "X"
        btnClosePopover.addEventListener('click', closePopover);
        
        // Fecha ao clicar no "Concluir"
        btnConcluir.addEventListener('click', closePopover);

        // Opcional: Fecha ao clicar fora da caixa (no overlay)
        overlay.addEventListener('click', closePopover);
    </script>

</body>
</html>
