    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project HUB - Login</title>

    <style>
        :root {
            --primary-color: #4B39EF; 
            --primary-glow: rgba(75, 57, 239, 0.35);
            --primary-focus: rgba(75, 57, 239, 0.15);
            --text-dark: #1F2937;
            --text-gray: #4B5563;
            --text-light: #6B7280;
            --border-color: #D1D5DB;
            --bg-body: #F4F7FB;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f0f4f8 0%, #ffffff 50%, #eef2f6 100%);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Cabeçalho */
        .header-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-img {
            height: 60px;
            width: auto;
            display: block;
            margin: 0 auto 15px auto;
            object-fit: contain;
        }

        .title {
            color: var(--primary-color);
            font-size: 30px;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-gray);
            font-size: 14px;
            margin: 0;
        }

        /* Cartão de Login */
        .login-card {
            background-color: #ffffff;
            width: 100%;
            border-radius: 16px;
            padding: 35px 40px;
            box-shadow: 0px 12px 35px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
            position: relative;
        }

        /* Camada escura de sobreposição */
        .overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(244, 247, 251, 0.8);
            border-radius: 16px;
            z-index: 5;
        }

        .overlay.active {
            display: block;
        }

        /* Badge Superior */
        .badge-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .badge {
            background-color: rgba(75, 57, 239, 0.05);
            border: 1px solid rgba(75, 57, 239, 0.2);
            color: var(--primary-color);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        /* Formulário */
        .input-group {
            margin-bottom: 22px;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .forgot-password {
            font-size: 12px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.left-icon {
            position: absolute;
            left: 16px;
            color: #9CA3AF;
            font-size: 15px;
        }
